<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turn Meter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one 720px column; white rounded cards on pale green-grey; the timer face with a 60-tick minute rail is the centrepiece */
:root{
  --paper:#F1F3EF; --card:#FFFFFF; --raise:#F7F9F5;
  --ink:#101613; --ink-2:#3C4742; --muted:#6B7871; --faint:#B4BEB8;
  --line:#E2E7E0; --line-2:#EDF0EA; --line-hi:#CBD6CE;
  --jade:#0F7B5A; --jade-hi:#12946B; --jade-soft:#DCEFE5; --jade-tick:#A5D8C1; --on-jade:#FFFFFF;
  --flag:#C2493C; --flag-soft:#FBEAE7; --flag-line:#EBD7D4;
  --amber:#93661F; --amber-soft:#F4EBD8; --amber-line:#E3D3B0;
  --inverse:#101613; --on-inverse:#F1F3EF;
  --heat-0:#E8ECE6; --heat-1:#DCEFE5; --heat-2:#A5D8C1; --heat-3:#4FA986; --heat-4:#0F7B5A;
  --shadow:0 1px 2px rgba(16,22,19,.05), 0 10px 30px rgba(16,22,19,.06);
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1210; --card:#161A17; --raise:#1C211D;
    --ink:#E7EDE9; --ink-2:#BCC6C0; --muted:#8C968F; --faint:#5E6863;
    --line:#282E2A; --line-2:#20251F; --line-hi:#3A423C;
    --jade:#18A87A; --jade-hi:#22C08D; --jade-soft:#12332A; --jade-tick:#1A6046; --on-jade:#04140E;
    --flag:#E4796A; --flag-soft:#38211E; --flag-line:#4C2B26;
    --amber:#D6A54A; --amber-soft:#332918; --amber-line:#4A3C22;
    --inverse:#E7EDE9; --on-inverse:#0E1210;
    --heat-0:#20251F; --heat-1:#14332A; --heat-2:#1A6046; --heat-3:#1F8F68; --heat-4:#2AC294;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1210; --card:#161A17; --raise:#1C211D;
  --ink:#E7EDE9; --ink-2:#BCC6C0; --muted:#8C968F; --faint:#5E6863;
  --line:#282E2A; --line-2:#20251F; --line-hi:#3A423C;
  --jade:#18A87A; --jade-hi:#22C08D; --jade-soft:#12332A; --jade-tick:#1A6046; --on-jade:#04140E;
  --flag:#E4796A; --flag-soft:#38211E; --flag-line:#4C2B26;
  --amber:#D6A54A; --amber-soft:#332918; --amber-line:#4A3C22;
  --inverse:#E7EDE9; --on-inverse:#0E1210;
  --heat-0:#20251F; --heat-1:#14332A; --heat-2:#1A6046; --heat-3:#1F8F68; --heat-4:#2AC294;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}

*,*::before,*::after{ box-sizing:border-box }
[hidden]{ display:none !important }
html{ -webkit-text-size-adjust:100% }
body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased }
p,h1,h2{ margin:0 }
button,input,textarea{ font:inherit; color:inherit }
:is(button,a,input,textarea):focus-visible{ outline:2px solid var(--jade); outline-offset:2px }

.wrap{
  max-width:720px; margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:26px 80px;
}
.eyebrow{ font-weight:600; text-transform:uppercase; letter-spacing:.1em; font-size:10.5px; color:var(--muted) }
.num{ font-family:var(--mono); font-variant-numeric:tabular-nums }

/* Top bar */
.topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:26px }
.mark{ font-weight:700; letter-spacing:-.02em; font-size:19px; color:var(--ink); text-decoration:none }
.linkbtn{ background:none; border:0; color:var(--muted); font-family:inherit; font-weight:600; font-size:13px; cursor:pointer; padding:7px 4px; border-radius:6px; text-decoration:none }
.linkbtn:hover{ color:var(--jade) }
.linkbtn.danger:hover{ color:var(--flag) }
.top-note{ font-size:12.5px; color:var(--muted) }

/* Running strip */
.runbar{ display:flex; align-items:center; gap:10px; margin-bottom:16px; padding:9px 12px; border:1px solid var(--jade); border-radius:11px; background:var(--jade-soft) }
.runbar-dot{ width:8px; height:8px; border-radius:999px; background:var(--jade); flex:none; animation:breathe 2s ease-in-out infinite }
.runbar-what{ flex:1 1 auto; min-width:0; display:flex; align-items:baseline; gap:8px; color:inherit; text-decoration:none }
.runbar-name{ font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.runbar-what:hover .runbar-name{ text-decoration:underline; text-underline-offset:2px }
.runbar-turn{ font-size:12px; color:var(--ink-2); white-space:nowrap }
.runbar-time{ font-family:var(--mono); font-size:13px; white-space:nowrap }
.runbar-btn{ font-family:inherit; font-weight:600; font-size:12px; padding:5px 12px; border:1px solid var(--jade); border-radius:7px; background:var(--card); color:var(--jade); cursor:pointer; white-space:nowrap }
.runbar-btn:hover{ background:var(--jade); color:var(--on-jade) }
@media (max-width:420px){ .runbar-turn{ display:none } }

/* Timer face */
.face{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:26px 24px 22px; box-shadow:var(--shadow) }
.face-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:22px }
.face-top > div{ min-width:0 }
.plate-name{ font-weight:700; font-size:20px; letter-spacing:-.02em; line-height:1.15; overflow-wrap:anywhere }
.plate-sub{ margin-top:5px; font-size:13.5px; color:var(--muted); white-space:pre-wrap; overflow-wrap:anywhere }
.state{ font-weight:600; text-transform:uppercase; letter-spacing:.09em; font-size:10px; padding:6px 11px; border-radius:999px; background:var(--line-2); color:var(--muted); white-space:nowrap }
.state.on{ background:var(--jade-soft); color:var(--jade) }
.state.paused{ background:var(--amber-soft); color:var(--amber) }
.clock{ margin-top:8px; font-family:var(--mono); font-weight:500; font-size:clamp(44px, 13vw, 64px); font-variant-numeric:tabular-nums; letter-spacing:-.035em; line-height:1 }
.clock.idle{ color:var(--faint) }
.clock.over{ color:var(--flag) }
.clock-note{ margin-top:10px; font-size:13px; color:var(--muted) }
.clock-note.over{ color:var(--flag) }
.clock-note.brk{ color:var(--amber) }

.rail{ display:flex; gap:2px; margin-top:22px; height:20px; align-items:flex-end }
.tick{ flex:1; background:var(--line); border-radius:2px; height:6px; transition:height .25s, background-color .25s }
.tick.q{ height:10px }
.tick.filled{ background:var(--jade-tick); height:11px }
.tick.head{ background:var(--jade); height:20px; animation:breathe 2s ease-in-out infinite }
.tick.head.still{ background:var(--amber); animation:none }
.tick.over{ background:var(--flag-line); height:11px }
.rail-legend{ display:flex; justify-content:space-between; margin-top:8px; font-family:var(--mono); font-size:11px; color:var(--muted) }

/* Forms and buttons */
.field{ display:grid; gap:7px; margin-top:20px }
.field > label{ font-weight:600; text-transform:uppercase; letter-spacing:.1em; font-size:10.5px; color:var(--muted) }
.field.first{ margin-top:0 }
.inp{ width:100%; background:var(--raise); border:1px solid var(--line); border-radius:9px; padding:11px 13px; color:var(--ink); font-size:14.5px }
.inp:focus{ border-color:var(--jade); background:var(--card); outline:none }
textarea.inp{ resize:vertical; min-height:64px; line-height:1.5 }
.inp::placeholder{ color:var(--faint) }
.saved{ font-size:12px; color:var(--muted); min-height:1.2em }

.controls{ display:flex; gap:9px; margin-top:22px; flex-wrap:wrap }
.btn{ font-family:inherit; font-weight:600; font-size:14px; padding:12px 20px; border-radius:9px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; flex:1; min-width:112px; transition:background-color .15s, border-color .15s, color .15s }
.btn:hover{ background:var(--raise); border-color:var(--line-hi) }
.btn.primary{ background:var(--jade); color:var(--on-jade); border-color:var(--jade) }
.btn.primary:hover{ background:var(--jade-hi); border-color:var(--jade-hi) }
.btn.danger{ color:var(--flag); border-color:var(--flag-line) }
.btn.danger:hover{ background:var(--flag-soft); border-color:var(--flag) }
.btn.sm{ flex:0 0 auto; min-width:0; padding:8px 14px; font-size:13px }

/* Sections */
.sec{ margin-top:30px }
.sec-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:0 2px 12px }
.sec-head .num{ font-size:11px; color:var(--muted) }
.panel{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; box-shadow:var(--shadow) }
.hint{ font-size:13px; color:var(--muted); line-height:1.55 }
.empty{ text-align:center; padding:14px 8px; color:var(--muted); font-size:13.5px }

/* Five-turn bar */
.util{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:12px }
.util-val{ font-family:var(--mono); font-size:22px; font-variant-numeric:tabular-nums }
.util-of{ font-size:12.5px; color:var(--muted) }
.split{ display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:3px }
.seg{ position:relative; height:7px; border-radius:999px; background:var(--line-2); overflow:hidden }
.seg .fill{ position:absolute; inset:0 auto 0 0; width:0; border-radius:999px; background:var(--jade); transition:width .5s ease }
.seg.paused .fill{ background:var(--amber) }
.seg.over .fill{ background:var(--flag) }
.legend{ display:flex; justify-content:space-between; gap:6px 12px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--muted) }
.legend .over{ color:var(--flag); font-weight:600 }

/* Turn rows */
.row{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; align-items:start; padding:14px 0; border-bottom:1px solid var(--line-2) }
.row:first-child{ padding-top:0 }
.row:last-child{ border-bottom:0; padding-bottom:0 }
.row-title{ font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px; flex-wrap:wrap }
.row-desc{ font-size:14px; color:var(--ink-2); margin-top:2px; white-space:pre-wrap; overflow-wrap:anywhere }
.row-desc.empty{ color:var(--faint) }
.row-meta{ font-size:12px; color:var(--muted); margin-top:4px }
.row-links{ display:flex; gap:10px; margin-top:2px; margin-left:-4px }
.row-links .linkbtn{ font-size:12px; padding:4px }
.row-amt{ font-family:var(--mono); font-size:15px; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap }
.row-over{ display:block; font-family:var(--mono); font-size:11.5px; color:var(--flag) }
.x{ background:none; border:0; color:var(--faint); cursor:pointer; font-size:18px; line-height:1; padding:2px 6px 6px; border-radius:6px; margin-top:-2px }
.x:hover{ color:var(--flag); background:var(--flag-soft) }
.tag{ font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; padding:2px 7px; border-radius:999px; background:var(--jade-soft); color:var(--jade) }
.tag.paused{ background:var(--amber-soft); color:var(--amber) }
.edit-turn{ grid-column:1 / -1; margin-top:10px; padding:16px; border-radius:11px; background:var(--raise); border:1px solid var(--line) }
.edit-turn .inp{ background:var(--card) }
.edit-turn .controls{ margin-top:16px }
.edit-turn .hint{ margin-top:2px; font-size:12.5px }
.adj{ display:flex; flex-wrap:wrap; align-items:center; gap:8px }
.adj .inp{ width:auto; padding:9px 11px }
.adj select.inp{ padding-right:8px }
.adj input[type="number"]{ width:68px }
.adj input[type="date"]{ min-width:150px }
.adj > span{ font-size:13px; color:var(--muted) }
.confirm{ margin-top:12px }
.confirm{ grid-column:1 / -1; display:flex; align-items:center; justify-content:space-between; gap:10px 14px; flex-wrap:wrap; padding:10px 12px; margin-top:8px; border-radius:9px; background:var(--flag-soft); font-size:13.5px }
.confirm .controls{ margin-top:0 }

/* Home */
.grand{ margin-bottom:24px }
.grand-amt{ font-family:var(--mono); font-size:clamp(34px, 9vw, 48px); font-variant-numeric:tabular-nums; letter-spacing:-.035em; line-height:1.05; margin-top:8px }
.grand-sub{ font-size:13px; color:var(--muted); margin-top:6px }
.banner{ display:flex; align-items:center; justify-content:space-between; gap:10px 14px; flex-wrap:wrap; border:1px solid var(--amber-line); background:var(--amber-soft); border-radius:14px; padding:14px 16px; margin-bottom:20px; font-size:13.5px; color:var(--ink-2) }
.banner .btn{ background:var(--card) }
.cards{ list-style:none; margin:0; padding:0; display:grid; gap:10px }
.card{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:0 14px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; color:inherit; text-decoration:none; box-shadow:var(--shadow); transition:border-color .15s, transform .15s }
.card:hover{ border-color:var(--line-hi); transform:translateY(-1px) }
.card-name{ display:block; font-weight:700; font-size:17px; letter-spacing:-.015em; overflow-wrap:anywhere }
.card-meta{ display:block; font-size:12.5px; color:var(--muted); margin-top:4px }
.card-amt{ display:block; font-family:var(--mono); font-size:17px; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap }
.card-dur{ display:block; font-size:12px; color:var(--muted); margin-top:4px; text-align:right; white-space:nowrap }
.card .split{ grid-column:1 / -1; margin-top:14px }
.card .seg{ height:5px }
.dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--jade); margin-right:8px; vertical-align:middle; animation:breathe 2s ease-in-out infinite }
.dot.paused{ background:var(--amber); animation:none }
.check{ display:inline-flex; gap:8px; align-items:center; cursor:pointer; font-size:13px; color:var(--muted) }
.check input{ width:16px; height:16px; margin:0; accent-color:var(--jade) }
.foot{ margin-top:40px; display:flex; flex-direction:column; align-items:center; gap:12px }
.theme{ display:flex; gap:2px; padding:2px; border-radius:999px; background:var(--line-2) }
.theme-btn{ display:grid; place-items:center; width:32px; height:32px; padding:0; border:0; border-radius:999px; background:none; color:var(--muted); cursor:pointer; transition:color .12s, background-color .12s }
.theme-btn:hover{ color:var(--ink-2) }
.theme-btn.on{ background:var(--card); color:var(--jade); box-shadow:0 1px 2px rgba(16,22,19,.07) }
.theme-btn svg{ width:15px; height:15px }

/* Activity calendar */
.hm-top{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:14px }
.hm-read{ font-family:var(--mono); font-size:11.5px; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums }
.hm-read.on{ color:var(--ink-2) }
.hm-scroll{ overflow-x:auto; padding-bottom:4px; scrollbar-width:thin }
.hm-grid{ display:grid; grid-template-columns:26px repeat(53, minmax(8px, 1fr)); grid-template-rows:auto; gap:3px; min-width:calc(26px + 53 * 11px) }
.hm-month{ width:0; overflow:visible; white-space:nowrap; font-family:var(--mono); font-size:10px; color:var(--muted); line-height:1.3 }
.hm-gut{ position:sticky; left:0; z-index:1; background:var(--card); box-shadow:3px 0 0 var(--card) }
.hm-day{ position:sticky; left:0; z-index:2; font-family:var(--mono); font-size:9.5px; color:var(--muted); line-height:1; align-self:center }
.hm-cell{ display:block; aspect-ratio:1 / 1; border-radius:2px; background:var(--heat-0) }
.hm-cell.l1{ background:var(--heat-1) } .hm-cell.l2{ background:var(--heat-2) }
.hm-cell.l3{ background:var(--heat-3) } .hm-cell.l4{ background:var(--heat-4) }
.hm-cell.today{ box-shadow:0 0 0 1.5px var(--ink) inset }
.hm-cell.future{ background:transparent }
.hm-cell[data-day]{ cursor:pointer }
.hm-cell[data-day]:hover, .hm-cell.picked{ outline:1.5px solid var(--ink); outline-offset:1px }
.hm-foot{ display:flex; justify-content:space-between; align-items:center; gap:10px 16px; flex-wrap:wrap; margin-top:14px; font-size:12px; color:var(--muted) }
.hm-key{ display:flex; align-items:center; gap:3px; font-family:var(--mono); font-size:10.5px }
.hm-key .hm-cell{ width:10px; height:10px; aspect-ratio:auto }
.hm-key span:first-child{ margin-right:4px } .hm-key span:last-child{ margin-left:4px }
.hm-stats{ display:flex; gap:6px 14px; flex-wrap:wrap }
.hm-stats b{ font-family:var(--mono); font-weight:500; color:var(--ink); font-variant-numeric:tabular-nums }
.backup-in{ font-family:var(--mono); font-size:12px }

.toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(24px + env(safe-area-inset-bottom, 0px)); z-index:50; background:var(--inverse); color:var(--on-inverse); border-radius:11px; padding:13px 16px; font-size:13.5px; box-shadow:0 12px 32px rgba(16,22,19,.22); width:max-content; max-width:calc(100vw - 32px) }

@keyframes breathe{ 0%,100%{ opacity:1 } 50%{ opacity:.35 } }
@media (max-width:480px){
  .face{ padding:22px 18px 18px }
  .panel{ padding:16px }
  .card{ padding:16px }
}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation:none !important; transition:none !important }
}
</style>
</head>
<body>
<div class="wrap">
  <div id="runbar"></div>
  <header class="topbar" id="topbar"></header>
  <main id="view"></main>
  <footer class="foot" id="foot"></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
'use strict';

const MAX_TURNS = 5;
const TURN_MS = 60 * 60 * 1000;
const BUDGET_MS = MAX_TURNS * TURN_MS;
const KEY = 'turn-meter.v1';

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const now = () => Date.now();
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const ids = (p, t) => `data-pid="${p.id}"${t ? ` data-tid="${t.id}"` : ''}`;

/* ---------- Storage ---------- */
let storageOK = true;

function valid(d) {
  return d && Array.isArray(d.projects) && d.projects.every(p =>
    p && typeof p.name === 'string' && Array.isArray(p.turns) &&
    p.turns.every(t => t && Array.isArray(t.segments) && t.segments.every(g => g && typeof g.s === 'number')));
}
function normalize(d) {
  d.settings = Object.assign({ chime: true, theme: 'system' }, d.settings || {});
  d.projects.forEach(p => {
    if (typeof p.id !== 'string' || !/^[a-z0-9-]+$/i.test(p.id)) p.id = uid();
    p.desc = p.desc || '';
    p.createdAt = p.createdAt || now();
    p.turns.forEach(t => {
      if (typeof t.id !== 'string' || !/^[a-z0-9-]+$/i.test(t.id)) t.id = uid();
      t.desc = t.desc || '';
      t.done = !!t.done;
      t.manual = Array.isArray(t.manual) ? t.manual.filter(m => m && typeof m.at === 'number' && typeof m.ms === 'number') : [];
      t.segments.forEach(g => { if (typeof g.e !== 'number') g.e = null; });
    });
  });
  return d;
}
function load() {
  let raw = null;
  try {
    raw = localStorage.getItem(KEY);
    localStorage.setItem(KEY + '.probe', '1');
    localStorage.removeItem(KEY + '.probe');
  } catch (e) { storageOK = false; }
  if (raw) {
    try { const d = JSON.parse(raw); if (valid(d)) return normalize(d); } catch (e) {}
    return { projects: [], settings: { chime: true, theme: 'system' } };
  }
  return normalize(seed());
}
function save() {
  if (!storageOK) return;
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { storageOK = false; render(); }
}

function seed() {
  const n = now(), M = 60e3, H = 60 * M;
  const seg = (s, m) => ({ s, e: s + m * M });
  const sod = new Date(n); sod.setHours(0, 0, 0, 0);
  const at = (daysAgo, h, m = 0) => { const d = new Date(sod); d.setDate(d.getDate() - daysAgo); d.setHours(h, m, 0, 0); return d.getTime(); };

let state = load();
const ui = {
  newOpen: false, editProject: false, editTurn: null, confirm: null,
  draftName: '', draftDesc: '', draftTurn: '',
  backupOpen: false, backupText: '', backupMsg: '', restorePending: null
};

/* ---------- Time math ---------- */
const getP = id => state.projects.find(p => p.id === id);
const lastSeg = t => t.segments[t.segments.length - 1];
const isRunning = t => { const g = lastSeg(t); return !!g && g.e == null; };
const manualMs = t => (t.manual || []).reduce((a, m) => a + m.ms, 0);
const turnMs = (t, n = now()) => Math.max(0, t.segments.reduce((a, g) => a + ((g.e ?? n) - g.s), 0) + manualMs(t));
const projectMs = (p, n = now()) => p.turns.reduce((a, t) => a + turnMs(t, n), 0);
const openTurn = p => p.turns.find(t => !t.done);
function gapsMs(t) { let b = 0; for (let i = 1; i < t.segments.length; i++) b += Math.max(0, t.segments[i].s - (t.segments[i - 1].e ?? t.segments[i].s)); return b; }
function curBreakMs(t, n = now()) { if (t.done) return 0; const g = lastSeg(t); return g && g.e != null ? Math.max(0, n - g.e) : 0; }
function breakCount(t) { const g = lastSeg(t); return Math.max(0, t.segments.length - 1) + (!t.done && g && g.e != null ? 1 : 0); }

function findRunning() { for (const p of state.projects) for (const t of p.turns) if (isRunning(t)) return { p, t }; return null; }
function lastActivity(p) { const n = now(); let m = p.createdAt || 0; p.turns.forEach(t => t.segments.forEach(g => { m = Math.max(m, g.s, g.e ?? n); })); return m; }

function fmtClock(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')}`;
}
const fmtTime = ts => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
function fmtDay(ts) {
  const d = new Date(ts), t = new Date(), y = new Date(); y.setDate(t.getDate() - 1);
  if (d.toDateString() === t.toDateString()) return 'Today';
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function fmtHM(ms) {
  const m = Math.round(ms / 60000);
  if (m <= 0) return ms > 0 ? '<1m' : '0m';
  const h = Math.floor(m / 60), r = m % 60;
  return h ? `${h}h ${String(r).padStart(2, '0')}m` : `${r}m`;
}

/* ---------- Activity calendar ---------- */
const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function sodOf(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
function nextDayOf(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + 1); return d.getTime(); }
function dayKey(ts) { const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function scopeProjects(scope) { return scope === 'all' ? state.projects : state.projects.filter(p => p.id === scope); }

/* Work time per local day; a session that crosses midnight is split between the two days. Breaks never count. */
function dailyTotals(projects, n = now()) {
  const map = new Map();
  projects.forEach(p => p.turns.forEach(t => t.segments.forEach(g => {
    let s = g.s; const e = g.e ?? n;
    while (s < e) {
      const b = Math.min(e, nextDayOf(s)), k = dayKey(s);
      let r = map.get(k); if (!r) { r = { ms: 0, names: new Set() }; map.set(k, r); }
      r.ms += b - s; r.names.add(p.name); s = b;
    }
  })));
  projects.forEach(p => p.turns.forEach(t => (t.manual || []).forEach(m => {
    const k = dayKey(m.at);
    let r = map.get(k); if (!r) { r = { ms: 0, names: new Set() }; map.set(k, r); }
    r.ms += m.ms; r.names.add(p.name);
  })));

}

  const to = nextDayOf(from); let ms = 0;

    const s = Math.max(g.s, from), e = Math.min(g.e ?? n, to); if (e > s) ms += e - s;
  })));
  projects.forEach(p => p.turns.forEach(t => (t.manual || []).forEach(m => { if (m.at >= from && m.at < to) ms += m.ms; })));
  return Math.max(0, ms);
}
const HOUR = 3600000;
const heatLevel = ms => ms <= 0 ? 0 : ms < HOUR ? 1 : ms < 2 * HOUR ? 2 : ms < 4 * HOUR ? 3 : 4;
const dayLabel = ts => new Date(ts).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });

function heatmap(scope) {
  const n = now(), projects = scopeProjects(scope), map = dailyTotals(projects, n);
  const today = sodOf(n);
  const start = new Date(today); start.setDate(start.getDate() - start.getDay() - 52 * 7);
  let cells = '', months = '', lastMonth = -1, lastLabelCol = -9, totalMs = 0, active = 0;
  for (let w = 0; w < 53; w++) {
    for (let d = 0; d < 7; d++) {
      const day = new Date(start); day.setDate(start.getDate() + w * 7 + d);
      const ts = day.getTime();
      if (day.getMonth() !== lastMonth && ts <= today + 6 * 864e5) {
        if (w - lastLabelCol >= 3 && !(w === 0 && day.getDate() > 14)) {
          months += `<span class="hm-month" style="grid-area:1/${w + 2}">${day.toLocaleDateString([], { month: 'short' })}</span>`;
          lastLabelCol = w;
        }
        lastMonth = day.getMonth();
      }
      const area = `grid-area:${d + 2}/${w + 2}`;
      if (ts > today) { cells += `<span class="hm-cell future" style="${area}"></span>`; continue; }
      const k = dayKey(ts), r = map.get(k), ms = r ? Math.max(0, r.ms) : 0, isToday = ts === today;
      if (ms > 0) { totalMs += ms; active++; }

    }

    <section class="sec hm" data-scope="${scope}">
      <div class="sec-head"><span class="eyebrow">Activity</span><span class="eyebrow">Hours worked per day</span></div>
      <div class="panel">
        <div class="hm-top"><span class="eyebrow">Last 12 months</span><span class="hm-read" aria-live="polite" data-default="Today · ${fmtHM(todayMs)}">Today · ${fmtHM(todayMs)}</span></div>
        <div class="hm-scroll"><div class="hm-grid" role="img" aria-label="${esc(`${fmtHM(totalMs)} worked on ${plural(active, 'day')} in the last 12 months`)}">${months}${dayRows}${cells}</div></div>
        <div class="hm-foot">
          <div class="hm-key" aria-label="Less than 1 hour to 4 hours or more"><span>Less</span><i class="hm-cell l0"></i><i class="hm-cell l1"></i><i class="hm-cell l2"></i><i class="hm-cell l3"></i><i class="hm-cell l4"></i><span>4h+</span></div>
          <div class="hm-stats"><span><b>${fmtHM(totalMs)}</b> worked</span><span><b>${active}</b> active ${active === 1 ? 'day' : 'days'}</span><span><b>${streak}</b>-day streak</span></div>
        </div>
      </div>
    </section>`;
}

/* ---------- Theme ---------- */
const root = document.documentElement;
let hostTheme = root.getAttribute('data-theme');
function applyTheme() {
  const t = state.settings.theme;
  if (t === 'light' || t === 'dark') { if (root.getAttribute('data-theme') !== t) root.setAttribute('data-theme', t); }
  else if (hostTheme) root.setAttribute('data-theme', hostTheme);

}
try {
  new MutationObserver(() => {
    const v = root.getAttribute('data-theme'), t = state.settings.theme;
    if (t === 'light' || t === 'dark') { if (v !== t) { hostTheme = v; applyTheme(); } }
    else hostTheme = v;

} catch (e) {}

/* ---------- Actions ---------- */
function closeRunning(except) {
  let closed = null;
  state.projects.forEach(p => p.turns.forEach(t => { if (t !== except && isRunning(t)) { lastSeg(t).e = now(); closed = { p, t }; } }));
  return closed;
}
function pausedNote(other) { if (other) toast(`Paused ${other.p.name}, turn ${other.p.turns.indexOf(other.t) + 1}.`); }

function startTurn(p, desc) {
  if (p.turns.length >= MAX_TURNS || openTurn(p)) return;
  const other = closeRunning();
  p.turns.push({ id: uid(), desc: desc.trim(), createdAt: now(), done: false, manual: [], segments: [{ s: now(), e: null }] });
  ui.draftTurn = '';
  save(); render(); pausedNote(other);
}
function pause(p, t) { if (!isRunning(t)) return; lastSeg(t).e = now(); save(); render(); }
function resume(p, t) {

  const other = closeRunning(t);
  t.segments.push({ s: now(), e: null });
  save(); render(); pausedNote(other);
}
function finish(p, t) {
  if (isRunning(t)) lastSeg(t).e = now();

  toast(`Turn ${p.turns.indexOf(t) + 1} saved: ${fmtClock(turnMs(t))}`);
}
function reopen(p, t) { if (openTurn(p)) return; t.done = false; delete t.finishedAt; save(); render(); }

/* ---------- Pieces ---------- */
function route() {

}

function segCls(t, n) {

        ${top(run ? 'Running' : 'Paused', run ? 'on' : 'paused')}
        <div class="eyebrow">Turn ${i} of ${MAX_TURNS}</div>
        <div class="clock${ms > TURN_MS ? ' over' : ''}" data-live="turn-clock" ${ids(p, o)}>${fmtClock(ms)}</div>
        ${run
          ? `<div class="clock-note${ms > TURN_MS ? ' over' : ''}" data-live="turn-left" ${ids(p, o)}>${leftText(o, n)}</div>`
          : `<div class="clock-note brk">On break · <span class="num" data-live="break-now" ${ids(p, o)}>${fmtClock(curBreakMs(o, n))}</span></div>`}
        ${rail(p, o)}
        <div class="field">
          <label for="turn-desc">What this turn is about</label>
          <textarea class="inp" id="turn-desc" rows="2" ${ids(p, o)} placeholder="Describe the work in this turn">${esc(o.desc)}</textarea>
          <span class="saved" id="saved-note" aria-live="polite"></span>
        </div>
        <div class="controls" style="margin-top:10px">
          ${run
            ? `<button class="btn" type="button" data-action="pause" ${ids(p, o)}>Pause</button>`
            : `<button class="btn primary" type="button" data-action="resume" ${ids(p, o)}>Resume</button>`}
          <button class="btn" type="button" data-action="finish" ${ids(p, o)}>Finish turn</button>
        </div>
      </section>`;
  }

  if (p.turns.length < MAX_TURNS) {
    const i = p.turns.length + 1;
    return `
      <form class="face" id="nt-form" data-pid="${p.id}" autocomplete="off">
        ${top('Ready', '')}
        <div class="eyebrow">Turn ${i} of ${MAX_TURNS}</div>
        <div class="clock idle">00:00:00</div>
        <div class="clock-note">The timer starts when you press Start.</div>
        ${rail(p, null)}
        <div class="field">
          <label for="nt-desc">What will this turn cover?</label>
          <textarea class="inp" id="nt-desc" rows="2" placeholder="Wire up the pause button">${esc(ui.draftTurn)}</textarea>
        </div>
        <div class="controls"><button class="btn primary" type="submit">Start turn ${i}</button></div>
      </form>`;
  }

  const last = p.turns[p.turns.length - 1];
  return `
    <section class="face" aria-label="All turns done">
      ${top('Done', '')}
      <div class="eyebrow">All ${MAX_TURNS} turns done</div>
      <div class="clock">${fmtClock(projectMs(p, n))}</div>
      <div class="clock-note">Total across ${MAX_TURNS} turns.</div>
      <div class="controls"><button class="btn" type="button" data-action="reopen" ${ids(p, last)}>Reopen turn ${MAX_TURNS}</button></div>
    </section>`;
}

function todayInput() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }

function turnRow(p, t, i) {
  const n = now(), ms = turnMs(t, n), run = isRunning(t), first = t.segments[0], last = lastSeg(t);
  const tag = t.done ? '' : `<span class="tag${run ? '' : ' paused'}">${run ? 'Running' : 'Paused'}</span>`;
  const end = t.done ? (last && last.e) || t.finishedAt : null;
  const when = first ? `${fmtDay(first.s)}, ${fmtTime(first.s)}${end ? ` – ${fmtTime(end)}` : ''}` : fmtDay(t.createdAt);
  const bc = breakCount(t), mm = manualMs(t);
  const meta = `${when} · ${bc ? plural(bc, 'break') : 'no breaks'}${mm ? ` · ${mm > 0 ? '+' : '−'}${fmtClock(Math.abs(mm))} entered by hand` : ''}`;
  const editing = ui.editTurn === t.id;
  const amt = `<div class="row-amt"><span data-live="turn-clock" ${ids(p, t)}>${fmtClock(ms)}</span><span class="row-over" data-live="turn-over" ${ids(p, t)}${ms > TURN_MS ? '' : ' hidden'}>+${fmtClock(ms - TURN_MS)}</span></div>`;

  if (editing) {
    const manualList = (t.manual || []).map(m => `${m.ms > 0 ? '+' : '−'}${fmtClock(Math.abs(m.ms))} on ${new Date(m.at).toLocaleDateString([], { month: 'short', day: 'numeric' })}`).join(', ');
    return `
      <div class="row editing">
        <div><div class="row-title">Turn ${i + 1}${tag}</div><div class="row-meta">${esc(meta)}</div></div>
        ${amt}
        <form class="edit-turn" ${ids(p, t)} autocomplete="off">
          <div class="field first"><label for="et-desc">Description</label><textarea class="inp" id="et-desc" rows="2">${esc(t.desc)}</textarea></div>
          <div class="field">
            <label for="et-h">Add time manually</label>
            <div class="adj">
              <select class="inp" id="et-sign" aria-label="Add or remove"><option value="1">Add</option><option value="-1">Remove</option></select>
              <input class="inp num" type="number" id="et-h" min="0" max="24" step="1" inputmode="numeric" placeholder="0" aria-label="Hours"><span>h</span>
              <input class="inp num" type="number" id="et-m" min="0" max="59" step="1" inputmode="numeric" placeholder="0" aria-label="Minutes"><span>m</span>
              <span>on</span>
              <input class="inp" type="date" id="et-date" value="${todayInput()}" max="${todayInput()}" aria-label="Day the work happened">
            </div>
            <p class="hint">For work done without the timer, or to fix a mistake. The time counts toward this turn and shows on the activity calendar on the day you pick.</p>
            ${manualList ? `<p class="hint">Entered by hand so far: <span class="num">${esc(manualList)}</span> · <button class="linkbtn" type="button" data-action="clear-manual" ${ids(p, t)} style="font-size:12.5px;padding:2px">Clear</button></p>` : ''}
          </div>
          <div class="controls"><button class="btn sm primary" type="submit">Save</button><button type="button" class="btn sm" data-action="cancel-edit-turn">Cancel</button></div>
          ${ui.confirm === 'turn:' + t.id
            ? confirmBox(`Delete turn ${i + 1} (${fmtClock(ms)})? This can't be undone.`, 'delete-turn', ids(p, t))
            : `<div class="row-links" style="margin-top:10px"><button class="linkbtn danger" type="button" data-action="ask-delete-turn" ${ids(p, t)}>Delete turn</button></div>`}
        </form>
      </div>`;
  }

  const links = [`<button class="linkbtn" type="button" data-action="edit-turn" ${ids(p, t)}>Edit</button>`];
  if (t.done && i === p.turns.length - 1 && !openTurn(p)) links.push(`<button class="linkbtn" type="button" data-action="reopen" ${ids(p, t)}>Reopen</button>`);
  return `
    <div class="row">
      <div>
        <div class="row-title">Turn ${i + 1}${tag}</div>
        <p class="row-desc${t.desc ? '' : ' empty'}" data-desc-for="${t.id}">${t.desc ? esc(t.desc) : 'No description'}</p>
        <div class="row-meta">${esc(meta)}</div>
        <div class="row-links">${links.join('')}</div>
      </div>
      ${amt}
    </div>`;
}

function editProjectForm(p) {
  return `
    <form class="panel edit-project" data-pid="${p.id}" autocomplete="off">
      <div class="field first"><label for="ep-name">Name</label><input class="inp" type="text" id="ep-name" maxlength="80" required value="${esc(p.name)}"></div>
      <div class="field"><label for="ep-desc">Description</label><textarea class="inp" id="ep-desc" rows="2" maxlength="800">${esc(p.desc)}</textarea></div>
      <div class="controls"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" data-action="cancel-edit-project">Cancel</button></div>
    </form>`;
}

/* ---------- Render ---------- */
function renderChrome(r) {
  $('#topbar').innerHTML = r.view === 'project'
    ? `<a class="mark" href="#">Turn Meter</a><a class="linkbtn" href="#">← All projects</a>`
    : `<a class="mark" href="#">Turn Meter</a><span class="top-note">5 turns × 60 min</span>`;
  const run = findRunning();
  const show = !!run && !(r.view === 'project' && r.p === run.p);
  $('#runbar').innerHTML = show ? `
    <div class="runbar">
      <span class="runbar-dot" aria-hidden="true"></span>
      <a class="runbar-what" href="#p-${run.p.id}"><span class="runbar-name">${esc(run.p.name)}</span><span class="runbar-turn">Turn ${run.p.turns.indexOf(run.t) + 1} of ${MAX_TURNS}</span></a>
      <span class="runbar-time" data-live="turn-clock" ${ids(run.p, run.t)}>${fmtClock(turnMs(run.t))}</span>
      <button class="runbar-btn" type="button" data-action="pause" ${ids(run.p, run.t)}>Pause</button>
    </div>` : '';
  const th = state.settings.theme || 'system';
  const opts = [['light', 'Day'], ['dark', 'Night'], ['system', 'Auto: match this device']];
  $('#foot').innerHTML = `
    <div class="theme" role="radiogroup" aria-label="Theme">
      ${opts.map(([k, label]) => `<button class="theme-btn${th === k ? ' on' : ''}" type="button" role="radio" aria-checked="${th === k}" aria-label="${label}" title="${label}" data-action="theme" data-theme-choice="${k}">${THEME_ICONS[k]}</button>`).join('')}
    </div>
    <label class="check" for="chime"><input type="checkbox" id="chime"${state.settings.chime ? ' checked' : ''}> Chime at 60 minutes and at 5 hours</label>`;
}
function render() {
  const r = route();
  renderChrome(r);
  $('#view').innerHTML = r.view === 'project' ? viewProject(r.p) : viewHome();
  document.querySelectorAll('.hm-scroll').forEach(el => { el.scrollLeft = el.scrollWidth; });
  updateLive();
}

/* ---------- Live ticking ---------- */
function updateLive() {
  const n = now();
  document.querySelectorAll('[data-live]').forEach(el => {
    if (el.dataset.live === 'grand') { el.textContent = fmtClock(state.projects.reduce((a, p) => a + projectMs(p, n), 0)); return; }
    if (el.dataset.live === 'hm-today') {
      const ms = dayMs(scopeProjects(el.dataset.scope), sodOf(n), n);
      el.className = `hm-cell l${heatLevel(ms)} today${el.classList.contains('picked') ? ' picked' : ''}`;
      el.dataset.ms = ms; el.title = `${dayLabel(+el.dataset.day)}: ${fmtHM(ms)}`;
      return;
    }
    const p = getP(el.dataset.pid); if (!p) return;
    const t = el.dataset.tid ? p.turns.find(x => x.id === el.dataset.tid) : null;
    switch (el.dataset.live) {
      case 'turn-clock': if (t) { const ms = turnMs(t, n); el.textContent = fmtClock(ms); if (el.classList.contains('clock')) el.classList.toggle('over', ms > TURN_MS); } break;
      case 'turn-left': if (t) { el.textContent = leftText(t, n); el.classList.toggle('over', turnMs(t, n) > TURN_MS); } break;
      case 'turn-over': if (t) { const d = turnMs(t, n) - TURN_MS; el.hidden = d <= 0; if (d > 0) el.textContent = `+${fmtClock(d)}`; } break;
      case 'break-now': if (t) el.textContent = fmtClock(curBreakMs(t, n)); break;
      case 'proj-clock': el.textContent = fmtClock(projectMs(p, n)); break;
      case 'proj-break': el.textContent = fmtClock(projectBreaks(p, n).ms); break;
      case 'proj-left': {
        const d = BUDGET_MS - projectMs(p, n);
        el.textContent = d >= 0 ? `${fmtClock(d)} left` : `${fmtClock(-d)} over budget`;
        el.classList.toggle('over', d < 0);
        break;
      }
      case 'seg': {
        const t2 = p.turns[+el.dataset.i];
        el.className = segCls(t2, n);
        const f = el.firstElementChild;
        if (f) f.style.width = (t2 ? Math.min(100, turnMs(t2, n) / TURN_MS * 100) : 0) + '%';
        break;
      }
      case 'hm-today': break;
      case 'rail': {
        const k = railKey(t, n);
        if (el.dataset.k !== k) { el.dataset.k = k; el.innerHTML = railTicks(t, n); }
        break;
      }
    }
  });
}

const alerted = new Set();
function primeAlerts() {
  alerted.clear();
  state.projects.forEach(p => {
    if (projectMs(p) >= BUDGET_MS) alerted.add(p.id + ':budget');
    p.turns.forEach(t => { if (turnMs(t) >= TURN_MS) alerted.add(t.id + ':hour'); });
  });
}

let actx = null;
function ensureAudio() {
  try {
    if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); }
    if (actx && actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
function chime() {
  if (!actx || !state.settings.chime) return;
  try {
    const t0 = actx.currentTime;
    [[0, 880], [0.2, 1320]].forEach(([d, f]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + d);
      g.gain.exponentialRampToValueAtTime(0.18, t0 + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.4);
      o.connect(g); g.connect(actx.destination);
      o.start(t0 + d); o.stop(t0 + d + 0.45);
    });
  } catch (e) {}
}

let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 4000);
}

const BASE_TITLE = document.title || 'Turn Meter';
let topLevel = false;
try { topLevel = window.top === window.self; } catch (e) {}
function updateTitle(run) {
  if (!topLevel) return;
  const t = run ? `${fmtClock(turnMs(run.t))} · ${run.p.name}` : BASE_TITLE;
  if (document.title !== t) document.title = t;
}

function tick() {
  updateLive();
  const run = findRunning();
  if (run) {
    const i = run.p.turns.indexOf(run.t) + 1;
    if (turnMs(run.t) >= TURN_MS && !alerted.has(run.t.id + ':hour')) {
      alerted.add(run.t.id + ':hour'); chime();
      toast(`${run.p.name}: turn ${i} reached 60 minutes.`);
    }
    if (projectMs(run.p) >= BUDGET_MS && !alerted.has(run.p.id + ':budget')) {
      alerted.add(run.p.id + ':budget'); chime();
      toast(`${run.p.name} reached the 5-hour budget.`);
    }
  }
  updateTitle(run);
}

/* ---------- Backup ---------- */
function setBackupMsg(m) { ui.backupMsg = m; const el = $('#backup-msg'); if (el) el.textContent = m; }
function copyBackup() {
  const json = JSON.stringify(state, null, 2);
  const fallback = () => {
    ui.backupText = json;
    const ta = $('#backup-in'); if (ta) { ta.value = json; ta.focus(); ta.select(); }
    setBackupMsg('Clipboard is blocked here. The backup is selected in the box above; copy it with Ctrl+C or ⌘C.');
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(json).then(() => setBackupMsg(`Copied ${plural(state.projects.length, 'project')}.`), fallback);
    } else fallback();
  } catch (e) { fallback(); }
}
function askRestore() {
  const raw = ($('#backup-in')?.value || '').trim();
  ui.backupText = raw;
  if (!raw) { setBackupMsg('Paste the text from Copy backup first.'); return; }
  try {
    const d = JSON.parse(raw);
    if (!valid(d)) throw new Error('shape');
    ui.restorePending = d; ui.backupMsg = ''; render();
  } catch (e) { setBackupMsg("That text isn't a Turn Meter backup. Paste the full text from Copy backup."); }
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]'); if (!b) return;
  ensureAudio();
  const a = b.dataset.action;
  const p = b.dataset.pid ? getP(b.dataset.pid) : null;
  const t = p && b.dataset.tid ? p.turns.find(x => x.id === b.dataset.tid) : null;
  switch (a) {
    case 'new-open': ui.newOpen = true; render(); $('#np-name')?.focus(); break;
    case 'new-close': ui.newOpen = false; render(); break;
    case 'clear-samples': state.projects = state.projects.filter(x => !x.sample); save(); render(); toast('Samples cleared.'); break;
    case 'pause': if (p && t) pause(p, t); break;
    case 'resume': if (p && t) resume(p, t); break;
    case 'finish': if (p && t) finish(p, t); break;
    case 'reopen': if (p && t) reopen(p, t); break;
    case 'edit-project': ui.editProject = true; ui.confirm = null; render(); $('#ep-name')?.focus(); break;
    case 'cancel-edit-project': ui.editProject = false; render(); break;
    case 'edit-turn': if (t) { ui.editTurn = t.id; ui.confirm = null; render(); $('#et-desc')?.focus(); } break;
    case 'clear-manual': if (t) { t.manual = []; save(); render(); toast('Manual time cleared.'); } break;
    case 'cancel-edit-turn': ui.editTurn = null; render(); break;
    case 'ask-delete-turn': if (t) { ui.confirm = 'turn:' + t.id; render(); } break;
    case 'delete-turn': if (p && t) { p.turns.splice(p.turns.indexOf(t), 1); ui.confirm = null; ui.editTurn = null; save(); render(); toast('Turn deleted.'); } break;
    case 'ask-delete-project': if (p) { ui.confirm = 'project:' + p.id; ui.editProject = false; render(); } break;
    case 'delete-project':
      if (p) { state.projects = state.projects.filter(x => x !== p); ui.confirm = null; save(); location.hash = ''; render(); toast(`Deleted ${p.name}.`); }
      break;
    case 'cancel-confirm': ui.confirm = null; render(); break;
    case 'theme': state.settings.theme = b.dataset.themeChoice; applyTheme(); save(); renderChrome(route()); break;
    case 'backup-toggle': ui.backupOpen = !ui.backupOpen; ui.restorePending = null; ui.backupMsg = ''; render(); break;
    case 'copy-backup': copyBackup(); break;
    case 'ask-restore': askRestore(); break;
    case 'cancel-restore': ui.restorePending = null; render(); break;
    case 'restore':
      if (ui.restorePending) {
        state = normalize(ui.restorePending); ui.restorePending = null; ui.backupText = ''; ui.backupMsg = 'Restored.';
        save(); primeAlerts(); location.hash = ''; render();
      }
      break;
  }
});

function showDay(cell, pin) {
  const box = cell.closest('.hm'); if (!box) return;
  const read = box.querySelector('.hm-read'), ms = +cell.dataset.ms, names = cell.dataset.names;
  read.textContent = `${dayLabel(+cell.dataset.day)} · ${fmtHM(ms)}${box.dataset.scope === 'all' && names ? ` · ${names}` : ''}`;
  read.classList.add('on');
  if (pin) { box.querySelectorAll('.hm-cell.picked').forEach(c => c.classList.remove('picked')); cell.classList.add('picked'); }
}
document.addEventListener('pointerover', e => { const c = e.target.closest?.('.hm-cell[data-day]'); if (c) showDay(c, false); });
document.addEventListener('pointerout', e => {
  const c = e.target.closest?.('.hm-cell[data-day]'); if (!c) return;
  const box = c.closest('.hm'), picked = box && box.querySelector('.hm-cell.picked');
  if (picked) showDay(picked, false);
  else if (box) { const r = box.querySelector('.hm-read'); r.textContent = r.dataset.default; r.classList.remove('on'); }
});
document.addEventListener('click', e => { const c = e.target.closest?.('.hm-cell[data-day]'); if (c) showDay(c, true); });

document.addEventListener('submit', e => {
  e.preventDefault(); ensureAudio();
  const f = e.target;
  if (f.id === 'np-form') {
    const name = $('#np-name').value.trim();
    if (!name) { $('#np-name').focus(); return; }
    const p = { id: uid(), name, desc: $('#np-desc').value.trim(), createdAt: now(), turns: [] };
    state.projects.push(p);
    ui.newOpen = false; ui.draftName = ''; ui.draftDesc = '';
    save(); location.hash = 'p-' + p.id;
  } else if (f.id === 'nt-form') {
    const p = getP(f.dataset.pid); if (p) startTurn(p, $('#nt-desc').value);
  } else if (f.classList.contains('edit-project')) {
    const p = getP(f.dataset.pid), name = $('#ep-name').value.trim();
    if (p && name) { p.name = name; p.desc = $('#ep-desc').value.trim(); ui.editProject = false; save(); render(); }
  } else if (f.classList.contains('edit-turn')) {
    const p = getP(f.dataset.pid), t = p && p.turns.find(x => x.id === f.dataset.tid);
    if (!t) return;
    t.desc = $('#et-desc').value.trim();
    const h = Math.max(0, parseInt($('#et-h').value, 10) || 0), m = Math.max(0, parseInt($('#et-m').value, 10) || 0);
    let amount = (h * 60 + m) * 60000, msg = 'Turn saved.';
    if (amount > 0) {
      const sign = $('#et-sign').value === '-1' ? -1 : 1;
      const parts = ($('#et-date').value || todayInput()).split('-').map(Number);
      let at = new Date(parts[0], (parts[1] || 1) - 1, parts[2] || 1, 12).getTime();
      if (!isFinite(at) || at > nextDayOf(now())) at = sodOf(now()) + 12 * HOUR;
      if (sign < 0) amount = Math.min(amount, turnMs(t));
      if (amount > 0) {
        (t.manual = t.manual || []).push({ at, ms: sign * amount, addedAt: now() });
        msg = `${sign > 0 ? 'Added' : 'Removed'} ${fmtClock(amount)} ${sign > 0 ? 'to' : 'from'} turn ${p.turns.indexOf(t) + 1}.`;
      }
    }
    ui.editTurn = null; ui.confirm = null; primeAlerts(); save(); render(); toast(msg);
  }
});

let saveTimer;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'np-name') ui.draftName = el.value;
  else if (el.id === 'np-desc') ui.draftDesc = el.value;
  else if (el.id === 'nt-desc') ui.draftTurn = el.value;
  else if (el.id === 'backup-in') ui.backupText = el.value;
  else if (el.id === 'turn-desc') {
    const p = getP(el.dataset.pid), t = p && p.turns.find(x => x.id === el.dataset.tid);
    if (!t) return;
    t.desc = el.value;
    const d = document.querySelector(`[data-desc-for="${t.id}"]`);
    if (d) { d.textContent = t.desc || 'No description'; d.classList.toggle('empty', !t.desc); }
    const s = $('#saved-note'); if (s) s.textContent = '';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { save(); const s2 = $('#saved-note'); if (s2) s2.textContent = 'Saved'; }, 400);
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'chime') { ensureAudio(); state.settings.chime = e.target.checked; save(); }
});

document.addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input', 'textarea', 'select', 'button', 'a'].includes(tag) || e.target.isContentEditable) return;
  const r = route(); if (r.view !== 'project') return;
  const o = openTurn(r.p); if (!o) return;
  e.preventDefault(); ensureAudio();
  isRunning(o) ? pause(r.p, o) : resume(r.p, o);
});

window.addEventListener('hashchange', () => {
  ui.confirm = null; ui.editProject = false; ui.editTurn = null;
  render(); window.scrollTo(0, 0);
});

window.addEventListener('storage', e => {
  if (e.key !== KEY || !e.newValue) return;
  try { const d = JSON.parse(e.newValue); if (valid(d)) { state = normalize(d); render(); } } catch (err) {}
});

/* ---------- Boot ---------- */
applyTheme();
primeAlerts();
save();
render();
setInterval(tick, 500);
})();
</script>
</body>
</html>
