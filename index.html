<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turn Meter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one 760px column on time-card stock; the five-slot hour meter repeats on every project as the signature element */
:root{
  --paper:#EDEFE9;
  --card:#FAFBF7;
  --ink:#1A1E1B;
  --muted:#59615C;
  --rule:#D3D8CF;
  --rule-strong:#A9B1A6;
  --accent:#2E45B4;
  --accent-ink:#FFFFFF;
  --run:#177A4B; --run-soft:#D6ECDD;
  --pause:#8A5508; --pause-soft:#F4E5C6;
  --over:#B3302A; --over-soft:#F5DAD5;
  --shadow:rgba(20,24,22,.16);
  --f-display:"Archivo","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111412; --card:#191D1A; --ink:#E6EAE4; --muted:#9AA39C; --rule:#2A302C; --rule-strong:#46504A;
    --accent:#93A2F7; --accent-ink:#0D1233;
    --run:#52C48C; --run-soft:#16331F; --pause:#E2A64C; --pause-soft:#382A12; --over:#F0766A; --over-soft:#3D1F1B;
    --shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111412; --card:#191D1A; --ink:#E6EAE4; --muted:#9AA39C; --rule:#2A302C; --rule-strong:#46504A;
  --accent:#93A2F7; --accent-ink:#0D1233;
  --run:#52C48C; --run-soft:#16331F; --pause:#E2A64C; --pause-soft:#382A12; --over:#F0766A; --over-soft:#3D1F1B;
  --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}

*,*::before,*::after{ box-sizing:border-box }
[hidden]{ display:none !important }
html{ -webkit-text-size-adjust:100% }
body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.5 }
button,input,textarea{ font:inherit; color:inherit }
p{ margin:0 }

.wrap{
  max-width:760px; margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px 48px;
}
body.has-runbar .wrap{ padding-bottom:120px }

h1,h2{ font-family:var(--f-display); font-stretch:78%; font-weight:700; line-height:1.05; margin:0; text-wrap:balance; letter-spacing:-0.005em }
h1{ font-size:clamp(32px, 7vw, 42px) }
h2{ font-size:23px }
.eyebrow{ font-family:var(--f-mono); font-size:11.5px; font-weight:500; letter-spacing:.09em; text-transform:uppercase; color:var(--muted) }
.mono{ font-family:var(--f-mono); font-variant-numeric:tabular-nums }
.muted{ color:var(--muted) }
.lede{ color:var(--muted); max-width:62ch; font-size:15.5px; white-space:pre-wrap; overflow-wrap:anywhere }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center }

/* Top bar */
.top{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:14px; border-bottom:1px solid var(--rule); margin-bottom:28px }
.brand{ display:inline-flex; align-items:center; gap:10px; font-family:var(--f-mono); font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink); text-decoration:none }
.brand-mark{ display:grid; grid-template-columns:repeat(5,4px); gap:2px; align-items:end; height:16px }
.brand-mark i{ display:block; background:var(--accent); border-radius:1px }
.brand-mark i:nth-child(1){ height:6px } .brand-mark i:nth-child(2){ height:9px } .brand-mark i:nth-child(3){ height:12px }
.brand-mark i:nth-child(4){ height:14px } .brand-mark i:nth-child(5){ height:16px }
.top-meta{ font-size:12px; color:var(--muted) }

#view{ display:grid; gap:28px }

/* Buttons */
.btn{
  appearance:none; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:42px; padding:0 16px; border:1px solid var(--rule-strong); border-radius:6px;
  background:var(--card); color:var(--ink); font:500 14.5px/1 var(--f-body);
  cursor:pointer; text-decoration:none; white-space:nowrap; transition:border-color .15s, background-color .15s, filter .15s;
}
.btn:hover{ border-color:var(--ink) }
.btn svg{ width:15px; height:15px; fill:currentColor; flex:none }
.btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink) }
.btn-primary:hover{ border-color:var(--accent); filter:brightness(1.08) }
.btn-lg{ min-height:52px; padding:0 22px; font-size:16px }
.btn-ghost{ background:transparent; border-color:transparent; color:var(--muted); padding:0 8px; min-height:34px; font-size:13.5px }
.btn-ghost:hover{ border-color:transparent; color:var(--ink) }
.btn-danger{ color:var(--over) }
.btn-danger:hover{ color:var(--over); text-decoration:underline }
.btn-danger-solid{ background:var(--over); border-color:var(--over); color:var(--card) }
.btn-danger-solid:hover{ border-color:var(--over); filter:brightness(1.06) }
:is(.btn, a, input, textarea, summary):focus-visible{ outline:2px solid var(--accent); outline-offset:2px }

/* Forms */
.field{ display:grid; gap:6px }
.field label{ font-size:13px; font-weight:500; color:var(--muted) }
input[type="text"], textarea{
  width:100%; background:var(--card); border:1px solid var(--rule-strong); border-radius:6px;
  padding:10px 12px; line-height:1.45;
}
textarea{ resize:vertical; min-height:76px }
input::placeholder, textarea::placeholder{ color:var(--muted); opacity:.75 }

.panel{ background:var(--card); border:1px solid var(--rule); border-radius:10px; padding:20px; display:grid; gap:18px }
.panel-head{ display:flex; justify-content:space-between; align-items:center; gap:12px }

/* Chips */
.chip{
  display:inline-flex; align-items:center; gap:6px; font-family:var(--f-mono); font-size:11px; font-weight:500;
  letter-spacing:.07em; text-transform:uppercase; padding:3px 8px; border-radius:999px;
  background:var(--paper); color:var(--muted); border:1px solid var(--rule); white-space:nowrap; line-height:1.4;
}
.chip-run{ background:var(--run-soft); color:var(--run); border-color:transparent }
.chip-run::before{ content:""; width:7px; height:7px; border-radius:50%; background:currentColor; animation:pulse 1.6s ease-in-out infinite }
.chip-pause{ background:var(--pause-soft); color:var(--pause); border-color:transparent }
.chip-over{ background:var(--over-soft); color:var(--over); border-color:transparent }
.chip-sample{ border-style:dashed }
.chips{ display:inline-flex; gap:6px; flex-wrap:wrap }
@keyframes pulse{ 50%{ opacity:.3 } }

/* Home */
.intro{ display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap }
.intro-text{ display:grid; gap:6px; min-width:0 }
.notice{ display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; padding:12px 14px; border:1px dashed var(--rule-strong); border-radius:8px; font-size:14px; color:var(--muted) }
.notice.warn{ border-style:solid; border-color:var(--pause); color:var(--ink); background:var(--pause-soft) }
.plist{ list-style:none; margin:0; padding:0; display:grid; gap:12px }
.pcard > a{ display:grid; gap:12px; padding:18px 18px 16px; background:var(--card); border:1px solid var(--rule); border-radius:10px; color:inherit; text-decoration:none; transition:border-color .15s }
.pcard > a:hover{ border-color:var(--rule-strong) }
.pcard-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px 12px; flex-wrap:wrap }
.pcard-head h2{ min-width:0; overflow-wrap:anywhere }
.pcard .desc{ color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere }
.pcard-foot{ display:flex; justify-content:space-between; gap:6px 12px; flex-wrap:wrap; font-size:13px; color:var(--muted) }
.pcard-foot b{ color:var(--ink); font-weight:600 }

/* Meter */
.meter{ display:grid; gap:6px }
.meter-scale, .meter-track, .meter-legend{ display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:4px }
.meter-scale > span{ font-family:var(--f-mono); font-size:10.5px; color:var(--muted) }
.meter-scale > span:last-child{ display:flex; justify-content:space-between }
.slot{ position:relative; height:16px; border-radius:3px; background:var(--rule); overflow:hidden }
.slot.empty{ background:transparent; border:1px dashed var(--rule-strong) }
.slot .fill{ position:absolute; inset:0 auto 0 0; width:0; background:var(--ink); transition:width .4s linear }
.slot.run .fill{ background:var(--run) }
.slot.pause .fill{ background:var(--pause) }
.slot.over::after{ content:""; position:absolute; right:0; top:0; bottom:0; width:5px; background:var(--over) }
.meter.compact .slot{ height:8px }
.meter-legend > span{ display:grid; gap:1px; font-family:var(--f-mono); font-size:10.5px; color:var(--muted); min-width:0 }
.meter-legend b{ font-weight:500; font-size:12px; color:var(--ink); font-variant-numeric:tabular-nums }
.meter-legend b.over{ color:var(--over) }
.meter-legend b.dim{ color:var(--muted); font-weight:400 }

/* Project page */
.crumbs{ margin:-10px 0 -14px -8px }
.phead{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap }
.phead-text{ display:grid; gap:8px; min-width:0; flex:1 1 300px }
.phead-text h1{ overflow-wrap:anywhere }
.budget{ display:grid; gap:16px }
.stats{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:1px; background:var(--rule); border:1px solid var(--rule); border-radius:10px; overflow:hidden }
.stat{ background:var(--card); padding:12px 14px; display:grid; gap:2px; align-content:start }
.stat .k{ font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted) }
.stat .v{ font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-size:21px; font-weight:500; line-height:1.25 }
.stat .s{ font-size:12px; color:var(--muted) }
.stat.over .k, .stat.over .v{ color:var(--over) }

.active-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap }
.clock-block{ display:grid; gap:6px }
.clock{ font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-weight:500; font-size:clamp(50px, 14vw, 84px); line-height:1; letter-spacing:-0.035em }
.clock.over{ color:var(--over) }
.clock-sub{ font-family:var(--f-mono); font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums }
.clock-sub.over{ color:var(--over) }
.clock-sub.brk{ color:var(--pause) }
.controls{ display:flex; gap:10px; flex-wrap:wrap; align-items:center }
.hint{ font-size:12.5px; color:var(--muted) }
.kbd{ font-family:var(--f-mono); font-size:11px; border:1px solid var(--rule-strong); border-bottom-width:2px; padding:1px 6px; border-radius:4px; margin-right:4px }
@media (hover:none){ .hint-key{ display:none } }
.saved{ font-size:12px; color:var(--muted); min-height:1em }

.log{ display:grid; gap:12px }
.log-head{ display:flex; justify-content:space-between; align-items:baseline; gap:12px }
.tlist{ list-style:none; margin:0; padding:0; border-top:1px solid var(--rule) }
.trow{ display:grid; grid-template-columns:34px minmax(0,1fr) auto; gap:4px 14px; padding:14px 0 10px; border-bottom:1px solid var(--rule); align-items:start }
.tnum{ font-family:var(--f-mono); font-size:13px; color:var(--muted); padding-top:2px }
.tmain{ display:grid; gap:4px; min-width:0 }
.tdesc{ white-space:pre-wrap; overflow-wrap:anywhere }
.tdesc.empty{ color:var(--muted); font-style:italic }
.tmeta{ font-size:12.5px; color:var(--muted) }
.tmeta .chip{ margin-right:8px; vertical-align:1px; padding:1px 7px; font-size:10.5px }
.ttime{ display:grid; justify-items:end; font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-weight:500 }
.over-note{ font-size:11.5px; font-weight:400; color:var(--over) }
.tfoot{ grid-column:2 / -1; display:flex; justify-content:space-between; align-items:flex-start; gap:4px 12px; flex-wrap:wrap }
.tactions{ display:flex; gap:2px; flex-wrap:wrap; margin-left:-8px }
.tfoot .confirm{ flex:1 1 100% }
details.segs{ font-size:13px; padding-top:7px }
details.segs summary{ cursor:pointer; color:var(--muted); font-size:12.5px }
.seglist{ list-style:none; padding:6px 0 2px; margin:0; display:grid; gap:2px; font-family:var(--f-mono); font-size:12px; color:var(--ink); font-variant-numeric:tabular-nums }
.seglist li{ display:flex; justify-content:space-between; gap:16px; min-width:220px }
.seglist li.brk{ color:var(--pause) }
.edit-turn{ display:grid; gap:8px }

.confirm{ display:flex; align-items:center; justify-content:space-between; gap:10px 14px; flex-wrap:wrap; padding:10px 12px; border-radius:8px; background:var(--over-soft); font-size:14px }

/* Footer */
.foot{ margin-top:44px; padding-top:16px; border-top:1px solid var(--rule); display:grid; gap:14px; font-size:13.5px; color:var(--muted) }
.check{ display:inline-flex; gap:8px; align-items:center; cursor:pointer; color:var(--ink) }
.check input{ width:16px; height:16px; margin:0; accent-color:var(--accent) }
.backup summary{ cursor:pointer; color:var(--ink); font-weight:500 }
.backup-body{ display:grid; gap:12px; padding-top:12px; max-width:62ch }
#backup-in{ font-family:var(--f-mono); font-size:12px }

/* Running bar */
#runbar{
  position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--ink); color:var(--paper);
  padding-top:10px; padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  box-shadow:0 -6px 24px var(--shadow);
}
.runbar-in{ max-width:728px; margin:0 auto; display:flex; align-items:center; gap:12px }
.runbar-dot{ width:9px; height:9px; border-radius:50%; background:var(--run); flex:none; animation:pulse 1.6s ease-in-out infinite }
.runbar-txt{ flex:1; min-width:0; display:grid; color:inherit; text-decoration:none; line-height:1.3 }
.runbar-name{ font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.runbar-sub{ font-size:12px; opacity:.75 }
.runbar-clock{ font-size:20px; font-weight:500 }
#runbar .btn{ background:transparent; color:inherit; border-color:currentColor; min-height:38px; padding:0 12px }

#toast{
  position:fixed; left:50%; transform:translateX(-50%); top:calc(12px + env(safe-area-inset-top, 0px)); z-index:30;
  background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:8px; font-size:14px;
  width:max-content; max-width:calc(100vw - 32px); box-shadow:0 8px 28px var(--shadow);
}

@media (max-width:560px){
  .stats{ grid-template-columns:repeat(2, minmax(0,1fr)) }
  .panel{ padding:16px }
  .controls .btn-lg{ flex:1 1 140px }
  .runbar-clock{ font-size:17px }
}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation:none !important; transition:none !important }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>Turn Meter</a>
    <span class="top-meta mono">5 turns × 60 min</span>
  </header>
  <div id="storage-warn" class="notice warn" hidden style="margin-bottom:20px">This browser is blocking storage, so projects will be lost when you close the page. Use Backup below to keep a copy.</div>
  <main id="view"></main>
  <footer class="foot">
    <label class="check" for="chime"><input type="checkbox" id="chime"> Chime when a turn reaches 60 minutes or a project reaches 5 hours</label>
    <details class="backup" id="backup">
      <summary>Backup and restore</summary>
      <div class="backup-body">
        <p>Projects are saved in this browser only. Copy a backup to keep it safe or to move it to another browser or device.</p>
        <div class="row"><button class="btn" type="button" data-action="copy-backup">Copy backup</button><span id="copy-note" class="muted" aria-live="polite"></span></div>
        <div class="field"><label for="backup-in">Paste a backup here to restore it</label><textarea id="backup-in" rows="4" spellcheck="false" placeholder='{"projects":[ ... ]}'></textarea></div>
        <div id="restore-zone"><button class="btn" type="button" data-action="ask-restore">Restore</button></div>
      </div>
    </details>
  </footer>
</div>
<div id="runbar" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
'use strict';

const MAX_TURNS = 5;
const TURN_MS = 60 * 60 * 1000;
const BUDGET_MS = MAX_TURNS * TURN_MS;
const KEY = 'turn-meter.v1';

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const now = () => Date.now();
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const ids = (p, t) => `data-pid="${p.id}"${t ? ` data-tid="${t.id}"` : ''}`;

const ICON = {
  play: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9.5-5.5z"/></svg>',
  pause: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h3.2v11H3.5zM9.3 2.5h3.2v11H9.3z"/></svg>',
  check: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.2 11.3 2.8 7.9 1.7 9l4.5 4.5 8.6-8.6-1.1-1.1z"/></svg>',
  plus: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7.25 2.5h1.5v4.75h4.75v1.5H8.75v4.75h-1.5V8.75H2.5v-1.5h4.75z"/></svg>',
  back: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.4 2.4 4.8 8l5.6 5.6 1.1-1.1L7 8l4.5-4.5z"/></svg>'
};

/* ---------- Storage ---------- */
let storageOK = true;

function valid(d) {
  return d && Array.isArray(d.projects) && d.projects.every(p =>
    p && typeof p.name === 'string' && Array.isArray(p.turns) &&
    p.turns.every(t => t && Array.isArray(t.segments) && t.segments.every(g => g && typeof g.s === 'number')));
}
function normalize(d) {
  d.settings = Object.assign({ chime: true }, d.settings || {});
  d.projects.forEach(p => {
    if (typeof p.id !== 'string' || !/^[a-z0-9-]+$/i.test(p.id)) p.id = uid();
    p.desc = p.desc || '';
    p.createdAt = p.createdAt || now();
    p.turns.forEach(t => {
      if (typeof t.id !== 'string' || !/^[a-z0-9-]+$/i.test(t.id)) t.id = uid();
      t.desc = t.desc || '';
      t.done = !!t.done;
      t.segments.forEach(g => { if (typeof g.e !== 'number') g.e = null; });
    });
  });
  return d;
}
function load() {
  let raw = null;
  try {
    raw = localStorage.getItem(KEY);
    localStorage.setItem(KEY + '.probe', '1');
    localStorage.removeItem(KEY + '.probe');
  } catch (e) { storageOK = false; }
  if (raw) {
    try { const d = JSON.parse(raw); if (valid(d)) return normalize(d); } catch (e) {}
    return { projects: [], settings: { chime: true } };
  }
  return seed();
}
function save() {
  if (!storageOK) return;
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { storageOK = false; $('#storage-warn').hidden = false; }
}

function seed() {
  const n = now(), M = 60e3, H = 60 * M;
  const seg = (s, m) => ({ s, e: s + m * M });
  const d1 = n - 26 * H, d2 = d1 + 75 * M, d3 = n - 5 * H, d4 = n - 35 * M, s0 = n - 3 * H;
  const camera = {
    id: uid(), name: 'Camera app', desc: 'Capture pipeline, live preview and a settings panel.', createdAt: d1 - 10 * M, sample: true,
    turns: [
      { id: uid(), desc: 'Set up the project and get a live camera preview on screen.', createdAt: d1, done: true, finishedAt: d1 + 58 * M, segments: [seg(d1, 58)] },
      { id: uid(), desc: 'Ring buffer that keeps the last 30 seconds of frames.', createdAt: d2, done: true, finishedAt: d2 + 69 * M, segments: [seg(d2, 25), seg(d2 + 29 * M, 31), seg(d2 + 65 * M, 8)] },
      { id: uid(), desc: 'Save a clip to disk when the button is pressed. Fixed dropped frames.', createdAt: d3, done: true, finishedAt: d3 + 47 * M, segments: [seg(d3, 47)] },
      { id: uid(), desc: 'Settings panel for resolution and frame rate.', createdAt: d4, done: false, segments: [seg(d4, 22)] }
    ]
  };
  const soccer = {
    id: uid(), name: 'Soccer app', desc: 'Tag match video by event and build simple per-player stats.', createdAt: s0 - 5 * M, sample: true,
    turns: [
      { id: uid(), desc: 'Sketch the event tagging screen: pass, shot, tackle.', createdAt: s0, done: true, finishedAt: s0 + 56 * M, segments: [seg(s0, 30), seg(s0 + 34 * M, 22)] }
    ]
  };
  return { projects: [camera, soccer], settings: { chime: true } };
}

let state = load();
const ui = { newOpen: false, editProject: false, editTurn: null, confirm: null, draftName: '', draftDesc: '', draftTurn: '', openSegs: new Set() };
let pendingRestore = null;

/* ---------- Time math ---------- */
const getP = id => state.projects.find(p => p.id === id);
const lastSeg = t => t.segments[t.segments.length - 1];
const isRunning = t => { const g = lastSeg(t); return !!g && g.e == null; };
const turnMs = (t, n = now()) => t.segments.reduce((a, g) => a + ((g.e ?? n) - g.s), 0);
const projectMs = (p, n = now()) => p.turns.reduce((a, t) => a + turnMs(t, n), 0);
const openTurn = p => p.turns.find(t => !t.done);
function gapsMs(t) { let b = 0; for (let i = 1; i < t.segments.length; i++) b += Math.max(0, t.segments[i].s - (t.segments[i - 1].e ?? t.segments[i].s)); return b; }
function curBreakMs(t, n = now()) { if (t.done) return 0; const g = lastSeg(t); return g && g.e != null ? Math.max(0, n - g.e) : 0; }
function breakCount(t) { const g = lastSeg(t); return Math.max(0, t.segments.length - 1) + (!t.done && g && g.e != null ? 1 : 0); }
function projectBreaks(p, n = now()) { let c = 0, ms = 0; p.turns.forEach(t => { c += breakCount(t); ms += gapsMs(t) + curBreakMs(t, n); }); return { c, ms }; }
function findRunning() { for (const p of state.projects) for (const t of p.turns) if (isRunning(t)) return { p, t }; return null; }
function projStatus(p) { const o = openTurn(p); if (o) return isRunning(o) ? 'run' : 'pause'; if (p.turns.length >= MAX_TURNS) return 'done'; return p.turns.length ? 'idle' : 'new'; }
function lastActivity(p) { const n = now(); let m = p.createdAt || 0; p.turns.forEach(t => t.segments.forEach(g => { m = Math.max(m, g.s, g.e ?? n); })); return m; }

function fmtClock(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return `${h}:${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')}`;
}
const fmtTime = ts => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
function fmtDay(ts) {
  const d = new Date(ts), t = new Date(), y = new Date(); y.setDate(t.getDate() - 1);
  if (d.toDateString() === t.toDateString()) return 'Today';
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

/* ---------- Actions ---------- */
function closeRunning(except) {
  let closed = null;
  state.projects.forEach(p => p.turns.forEach(t => { if (t !== except && isRunning(t)) { lastSeg(t).e = now(); closed = { p, t }; } }));
  return closed;
}
function pausedNote(other) { if (other) toast(`Paused ${other.p.name}, turn ${other.p.turns.indexOf(other.t) + 1}.`); }

function startTurn(p, desc) {
  if (p.turns.length >= MAX_TURNS || openTurn(p)) return;
  const other = closeRunning();
  p.turns.push({ id: uid(), desc: desc.trim(), createdAt: now(), done: false, segments: [{ s: now(), e: null }] });
  ui.draftTurn = '';
  save(); render(); pausedNote(other);
}
function pause(p, t) { if (!isRunning(t)) return; lastSeg(t).e = now(); save(); render(); }
function resume(p, t) {
  if (t.done || isRunning(t)) return;
  const other = closeRunning(t);
  t.segments.push({ s: now(), e: null });
  save(); render(); pausedNote(other);
}
function finish(p, t) {
  if (isRunning(t)) lastSeg(t).e = now();
  t.done = true; t.finishedAt = now();
  save(); render();
  toast(`Turn ${p.turns.indexOf(t) + 1} logged: ${fmtClock(turnMs(t))}.`);
}
function reopen(p, t) { if (openTurn(p)) return; t.done = false; delete t.finishedAt; save(); render(); }

/* ---------- Views ---------- */
function route() {
  const h = location.hash.slice(1);
  if (h.startsWith('p-')) { const p = getP(h.slice(2)); if (p) return { view: 'project', p }; }
  return { view: 'home' };
}

function chip(kind, label) {
  const cls = { run: 'chip-run', pause: 'chip-pause', over: 'chip-over', sample: 'chip-sample' }[kind] || '';
  return `<span class="chip ${cls}">${esc(label)}</span>`;
}

function slotCls(t, n) {
  if (!t) return 'empty';
  let c = t.done ? 'done' : isRunning(t) ? 'run' : 'pause';
  if (turnMs(t, n) > TURN_MS) c += ' over';
  return c;
}
function meter(p, compact) {
  const n = now(), total = projectMs(p, n);
  let track = '', legend = '';
  for (let i = 0; i < MAX_TURNS; i++) {
    const t = p.turns[i];
    const w = t ? Math.min(100, turnMs(t, n) / TURN_MS * 100) : 0;
    track += `<div class="slot ${slotCls(t, n)}" data-live="slot" data-pid="${p.id}" data-i="${i}"><span class="fill" style="width:${w}%"></span></div>`;
    if (!compact) {
      legend += t
        ? `<span><em>Turn ${i + 1}</em><b class="${turnMs(t, n) > TURN_MS ? 'over' : ''}" data-live="turn-clock" ${ids(p, t)}>${fmtClock(turnMs(t, n))}</b></span>`
        : `<span><em>Turn ${i + 1}</em><b class="dim">–</b></span>`;
    }
  }
  const scale = compact ? '' : `<div class="meter-scale" aria-hidden="true"><span>0h</span><span>1h</span><span>2h</span><span>3h</span><span><span>4h</span><span>5h</span></span></div>`;
  const label = `${fmtClock(total)} of 5 hours used across ${plural(p.turns.length, 'turn')}`;
  return `<div class="meter${compact ? ' compact' : ''}" role="img" aria-label="${esc(label)}">${scale}<div class="meter-track">${track}</div>${compact ? '' : `<div class="meter-legend" aria-hidden="true">${legend}</div>`}</div>`;
}

function viewHome() {
  const ps = [...state.projects].sort((a, b) => lastActivity(b) - lastActivity(a));
  const showForm = ui.newOpen || ps.length === 0;
  const samples = ps.filter(p => p.sample);
  return `
    <section class="intro">
      <div class="intro-text">
        <h1>Projects</h1>
        <p class="lede">Each project gets ${MAX_TURNS} turns of about an hour, ${MAX_TURNS} hours in all. Open a project to start or resume a turn.</p>
      </div>
      ${showForm ? '' : `<button class="btn btn-primary" type="button" data-action="new-open">${ICON.plus} New project</button>`}
    </section>
    ${showForm ? newProjectForm(ps.length === 0) : ''}
    ${samples.length ? `<div class="notice"><span>${samples.map(p => esc(p.name)).join(' and ')} ${samples.length > 1 ? 'are sample projects' : 'is a sample project'} so you can see how turns look.</span><button class="btn" type="button" data-action="clear-samples">Clear samples</button></div>` : ''}
    ${ps.length ? `<ul class="plist">${ps.map(projectCard).join('')}</ul>` : ''}`;
}

function newProjectForm(first) {
  return `
    <form class="panel" id="np-form" autocomplete="off">
      <div class="panel-head"><h2>${first ? 'Create your first project' : 'New project'}</h2>${first ? '' : '<button type="button" class="btn btn-ghost" data-action="new-close">Cancel</button>'}</div>
      <div class="field"><label for="np-name">Project name</label><input type="text" id="np-name" maxlength="80" required placeholder="e.g. Camera app" value="${esc(ui.draftName)}"></div>
      <div class="field"><label for="np-desc">Description</label><textarea id="np-desc" rows="3" maxlength="800" placeholder="What is this project about?">${esc(ui.draftDesc)}</textarea></div>
      <div class="row"><button class="btn btn-primary" type="submit">Create project</button></div>
    </form>`;
}

function projectCard(p) {
  const st = projStatus(p), o = openTurn(p), n = p.turns.length;
  const label = { run: 'Running', pause: 'Paused', done: 'All turns used', idle: 'Idle', new: 'Not started' }[st];
  const turnLabel = o ? `Turn ${p.turns.indexOf(o) + 1} of ${MAX_TURNS}` : `${n} of ${MAX_TURNS} turns`;
  const over = projectMs(p) > BUDGET_MS;
  return `
    <li class="pcard"><a href="#p-${p.id}">
      <div class="pcard-head"><h2>${esc(p.name)}</h2><span class="chips">${p.sample ? chip('sample', 'Sample') : ''}${over ? chip('over', 'Over 5h') : ''}${chip(st, label)}</span></div>
      ${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ''}
      ${meter(p, true)}
      <div class="pcard-foot"><span class="mono"><b data-live="proj-clock" data-pid="${p.id}">${fmtClock(projectMs(p))}</b> / ${fmtClock(BUDGET_MS)}</span><span>${turnLabel}</span></div>
    </a></li>`;
}

function viewProject(p) {
  const n = now(), used = p.turns.length, total = projectMs(p, n), br = projectBreaks(p, n), left = BUDGET_MS - total;
  const head = ui.editProject ? `
    <form class="panel edit-project" data-pid="${p.id}" autocomplete="off">
      <div class="panel-head"><h2>Edit project</h2></div>
      <div class="field"><label for="ep-name">Project name</label><input type="text" id="ep-name" maxlength="80" required value="${esc(p.name)}"></div>
      <div class="field"><label for="ep-desc">Description</label><textarea id="ep-desc" rows="3" maxlength="800">${esc(p.desc)}</textarea></div>
      <div class="row"><button class="btn btn-primary" type="submit">Save</button><button class="btn" type="button" data-action="cancel-edit-project">Cancel</button></div>
    </form>` : `
    <header class="phead">
      <div class="phead-text">
        <span class="eyebrow">Project${p.sample ? ' · Sample' : ''}</span>
        <h1>${esc(p.name)}</h1>
        ${p.desc ? `<p class="lede">${esc(p.desc)}</p>` : ''}
      </div>
      <button class="btn" type="button" data-action="edit-project" ${ids(p)}>Edit</button>
    </header>`;
  return `
    <nav class="crumbs"><a href="#" class="btn btn-ghost">${ICON.back} All projects</a></nav>
    ${head}
    <section class="budget" aria-label="Time budget">
      <div class="stats">
        <div class="stat"><span class="k">Total</span><span class="v" data-live="proj-clock" ${ids(p)}>${fmtClock(total)}</span><span class="s">of ${fmtClock(BUDGET_MS)}</span></div>
        <div class="stat${left < 0 ? ' over' : ''}" data-live="proj-left" ${ids(p)}><span class="k">${left < 0 ? 'Over budget' : 'Left'}</span><span class="v">${fmtClock(Math.abs(left))}</span><span class="s">5-hour budget</span></div>
        <div class="stat"><span class="k">Turns</span><span class="v">${used} / ${MAX_TURNS}</span><span class="s">${MAX_TURNS - used} not started</span></div>
        <div class="stat"><span class="k">Breaks</span><span class="v" data-live="proj-break" ${ids(p)}>${fmtClock(br.ms)}</span><span class="s">${plural(br.c, 'pause')}</span></div>
      </div>
      ${meter(p, false)}
    </section>
    ${activePanel(p)}
    ${turnLog(p)}
    <section>${ui.confirm === 'project:' + p.id
      ? confirmRow(`Delete ${esc(p.name)} and its ${plural(p.turns.length, 'turn')}? This can't be undone.`, 'delete-project', ids(p))
      : `<button class="btn btn-ghost btn-danger" type="button" data-action="ask-delete-project" ${ids(p)} style="margin-left:-8px">Delete project</button>`}</section>`;
}

function activePanel(p) {
  const o = openTurn(p);
  if (o) {
    const i = p.turns.indexOf(o) + 1, run = isRunning(o), ms = turnMs(o), d = TURN_MS - ms;
    return `
      <section class="panel" aria-label="Current turn">
        <div class="active-head"><span class="eyebrow">Turn ${i} of ${MAX_TURNS}</span>${chip(run ? 'run' : 'pause', run ? 'Running' : 'Paused')}</div>
        <div class="clock-block">
          <div class="clock${ms > TURN_MS ? ' over' : ''}" data-live="turn-clock" ${ids(p, o)}>${fmtClock(ms)}</div>
          <div class="clock-sub${d < 0 ? ' over' : ''}" data-live="turn-left" ${ids(p, o)}>${d >= 0 ? `${fmtClock(d)} left in this hour` : `${fmtClock(-d)} past the hour`}</div>
          ${run ? '' : `<div class="clock-sub brk">On break for <span data-live="break-now" ${ids(p, o)}>${fmtClock(curBreakMs(o))}</span></div>`}
        </div>
        <div class="controls">
          ${run
            ? `<button class="btn btn-lg" type="button" data-action="pause" ${ids(p, o)}>${ICON.pause} Pause</button>`
            : `<button class="btn btn-primary btn-lg" type="button" data-action="resume" ${ids(p, o)}>${ICON.play} Resume</button>`}
          <button class="btn btn-lg" type="button" data-action="finish" ${ids(p, o)}>${ICON.check} Finish turn</button>
          <span class="hint hint-key"><span class="kbd">Space</span>${run ? 'pauses' : 'resumes'}</span>
        </div>
        <div class="field">
          <label for="turn-desc">What this turn is about</label>
          <textarea id="turn-desc" rows="3" ${ids(p, o)} placeholder="Describe the work in this turn">${esc(o.desc)}</textarea>
          <span class="saved" id="saved-note" aria-live="polite"></span>
        </div>
      </section>`;
  }
  if (p.turns.length < MAX_TURNS) {
    const i = p.turns.length + 1;
    return `
      <form class="panel" id="nt-form" data-pid="${p.id}" autocomplete="off">
        <div class="active-head"><span class="eyebrow">Turn ${i} of ${MAX_TURNS}</span><span class="chip">Ready</span></div>
        <div class="field"><label for="nt-desc">What will this turn cover?</label><textarea id="nt-desc" rows="3" placeholder="e.g. Wire up the pause button">${esc(ui.draftTurn)}</textarea></div>
        <div class="controls"><button class="btn btn-primary btn-lg" type="submit">${ICON.play} Start turn ${i}</button><span class="hint">The timer starts right away. You can edit the description while it runs.</span></div>
      </form>`;
  }
  const last = p.turns[p.turns.length - 1];
  return `
    <section class="panel" aria-label="Turns complete">
      <div class="active-head"><span class="eyebrow">All ${MAX_TURNS} turns used</span><span class="chip">Complete</span></div>
      <p>This project logged <b class="mono">${fmtClock(projectMs(p))}</b> across ${MAX_TURNS} turns.</p>
      <div class="controls"><button class="btn" type="button" data-action="reopen" ${ids(p, last)}>Reopen turn ${MAX_TURNS}</button></div>
    </section>`;
}

function segDetails(t, n) {
  if (t.segments.length < 2) return '';
  const items = [];
  t.segments.forEach((g, i) => {
    if (i > 0) items.push(`<li class="brk"><span>Break</span><span>${fmtClock(g.s - (t.segments[i - 1].e ?? g.s))}</span></li>`);
    items.push(`<li><span>${fmtTime(g.s)} – ${g.e != null ? fmtTime(g.e) : 'now'}</span><span>${fmtClock((g.e ?? n) - g.s)}</span></li>`);
  });
  return `<details class="segs" data-seg="${t.id}"${ui.openSegs.has(t.id) ? ' open' : ''}><summary>${t.segments.length} work sessions</summary><ul class="seglist">${items.join('')}</ul></details>`;
}

function confirmRow(msg, action, attrs) {
  return `<div class="confirm" role="alert"><span>${msg}</span><div class="row"><button class="btn btn-danger-solid" type="button" data-action="${action}" ${attrs}>Delete</button><button class="btn" type="button" data-action="cancel-confirm">Keep</button></div></div>`;
}

function turnRow(p, t, i, o) {
  const n = now(), ms = turnMs(t, n), run = isRunning(t), first = t.segments[0], last = lastSeg(t);
  const status = t.done ? '' : run ? chip('run', 'Running') : chip('pause', 'Paused');
  const end = t.done ? (last && last.e) || t.finishedAt : null;
  const when = first ? `${fmtDay(first.s)}, ${fmtTime(first.s)}${end ? ` – ${fmtTime(end)}` : ''}` : fmtDay(t.createdAt);
  const bc = breakCount(t);
  const meta = `${when} · ${bc ? `${plural(bc, 'break')} (${fmtClock(gapsMs(t) + curBreakMs(t, n))})` : 'no breaks'}`;
  const editing = ui.editTurn === t.id;
  const isLast = i === p.turns.length - 1;
  const body = editing
    ? `<form class="edit-turn" ${ids(p, t)}><label class="sr" for="et-${t.id}">Description for turn ${i + 1}</label><textarea id="et-${t.id}" rows="2">${esc(t.desc)}</textarea><div class="row"><button class="btn btn-primary" type="submit">Save</button><button type="button" class="btn" data-action="cancel-edit-turn">Cancel</button></div></form>`
    : `<p class="tdesc${t.desc ? '' : ' empty'}" data-desc-for="${t.id}">${t.desc ? esc(t.desc) : 'No description'}</p>`;
  const actions = ui.confirm === 'turn:' + t.id
    ? confirmRow(`Delete turn ${i + 1} (${fmtClock(ms)})?`, 'delete-turn', ids(p, t))
    : `<div class="tactions">
        ${t.done && !editing ? `<button class="btn btn-ghost" type="button" data-action="edit-turn" ${ids(p, t)}>Edit description</button>` : ''}
        ${t.done && isLast && !o ? `<button class="btn btn-ghost" type="button" data-action="reopen" ${ids(p, t)}>Reopen</button>` : ''}
        <button class="btn btn-ghost btn-danger" type="button" data-action="ask-delete-turn" ${ids(p, t)}>Delete</button>
      </div>`;
  return `
    <li class="trow">
      <span class="tnum">${String(i + 1).padStart(2, '0')}</span>
      <div class="tmain">${body}<p class="tmeta">${status}${esc(meta)}</p></div>
      <div class="ttime"><span data-live="turn-clock" ${ids(p, t)}>${fmtClock(ms)}</span><span class="over-note" data-live="turn-over" ${ids(p, t)}${ms > TURN_MS ? '' : ' hidden'}>+${fmtClock(ms - TURN_MS)} over</span></div>
      <div class="tfoot">${segDetails(t, n)}${actions}</div>
    </li>`;
}

function turnLog(p) {
  if (!p.turns.length) return `<section class="log"><h2>Turn log</h2><p class="muted">No turns yet. Start turn 1 above.</p></section>`;
  const o = openTurn(p);
  return `
    <section class="log">
      <div class="log-head"><h2>Turn log</h2><span class="eyebrow">${p.turns.length} of ${MAX_TURNS}</span></div>
      <ol class="tlist">${p.turns.map((t, i) => turnRow(p, t, i, o)).join('')}</ol>
    </section>`;
}

function renderRunbar(r) {
  const rb = $('#runbar'), run = findRunning();
  const show = !!run && !(r.view === 'project' && r.p === run.p);
  rb.hidden = !show;
  document.body.classList.toggle('has-runbar', show);
  if (!show) { rb.innerHTML = ''; return; }
  const i = run.p.turns.indexOf(run.t) + 1;
  rb.innerHTML = `
    <div class="runbar-in">
      <span class="runbar-dot" aria-hidden="true"></span>
      <a class="runbar-txt" href="#p-${run.p.id}"><span class="runbar-name">${esc(run.p.name)}</span><span class="runbar-sub">Turn ${i} of ${MAX_TURNS} running · open</span></a>
      <span class="runbar-clock mono" data-live="turn-clock" ${ids(run.p, run.t)}>${fmtClock(turnMs(run.t))}</span>
      <button class="btn" type="button" data-action="pause" ${ids(run.p, run.t)}>${ICON.pause} Pause</button>
    </div>`;
}

function render() {
  const r = route();
  $('#view').innerHTML = r.view === 'project' ? viewProject(r.p) : viewHome();
  renderRunbar(r);
  updateLive();
}

/* ---------- Live ticking ---------- */
function updateLive() {
  const n = now();
  document.querySelectorAll('[data-live]').forEach(el => {
    const p = getP(el.dataset.pid); if (!p) return;
    const t = el.dataset.tid ? p.turns.find(x => x.id === el.dataset.tid) : null;
    switch (el.dataset.live) {
      case 'turn-clock': if (t) { const ms = turnMs(t, n); el.textContent = fmtClock(ms); el.classList.toggle('over', ms > TURN_MS); } break;
      case 'turn-left': if (t) { const d = TURN_MS - turnMs(t, n); el.textContent = d >= 0 ? `${fmtClock(d)} left in this hour` : `${fmtClock(-d)} past the hour`; el.classList.toggle('over', d < 0); } break;
      case 'turn-over': if (t) { const d = turnMs(t, n) - TURN_MS; el.hidden = d <= 0; if (d > 0) el.textContent = `+${fmtClock(d)} over`; } break;
      case 'break-now': if (t) el.textContent = fmtClock(curBreakMs(t, n)); break;
      case 'proj-clock': el.textContent = fmtClock(projectMs(p, n)); break;
      case 'proj-break': el.textContent = fmtClock(projectBreaks(p, n).ms); break;
      case 'proj-left': {
        const d = BUDGET_MS - projectMs(p, n);
        el.querySelector('.k').textContent = d >= 0 ? 'Left' : 'Over budget';
        el.querySelector('.v').textContent = fmtClock(Math.abs(d));
        el.classList.toggle('over', d < 0);
        break;
      }
      case 'slot': {
        const t2 = p.turns[+el.dataset.i];
        el.className = 'slot ' + slotCls(t2, n);
        const f = el.firstElementChild;
        if (f) f.style.width = (t2 ? Math.min(100, turnMs(t2, n) / TURN_MS * 100) : 0) + '%';
        break;
      }
    }
  });
}

const alerted = new Set();
function primeAlerts() {
  alerted.clear();
  state.projects.forEach(p => {
    if (projectMs(p) >= BUDGET_MS) alerted.add(p.id + ':budget');
    p.turns.forEach(t => { if (turnMs(t) >= TURN_MS) alerted.add(t.id + ':hour'); });
  });
}

let actx = null;
function ensureAudio() {
  try {
    if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); }
    if (actx && actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
function chime() {
  if (!actx || !state.settings.chime) return;
  try {
    const t0 = actx.currentTime;
    [[0, 880], [0.2, 1320]].forEach(([d, f]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + d);
      g.gain.exponentialRampToValueAtTime(0.18, t0 + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.4);
      o.connect(g); g.connect(actx.destination);
      o.start(t0 + d); o.stop(t0 + d + 0.45);
    });
  } catch (e) {}
}

let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 4500);
}

const BASE_TITLE = document.title || 'Turn Meter';
let topLevel = false;
try { topLevel = window.top === window.self; } catch (e) {}
function updateTitle(run) {
  if (!topLevel) return;
  const t = run ? `▶ ${fmtClock(turnMs(run.t))} · ${run.p.name}` : BASE_TITLE;
  if (document.title !== t) document.title = t;
}

function tick() {
  updateLive();
  const run = findRunning();
  if (run) {
    const i = run.p.turns.indexOf(run.t) + 1;
    if (turnMs(run.t) >= TURN_MS && !alerted.has(run.t.id + ':hour')) {
      alerted.add(run.t.id + ':hour'); chime();
      toast(`${run.p.name}: turn ${i} reached 60 minutes.`);
    }
    if (projectMs(run.p) >= BUDGET_MS && !alerted.has(run.p.id + ':budget')) {
      alerted.add(run.p.id + ':budget'); chime();
      toast(`${run.p.name} reached the 5-hour budget.`);
    }
  }
  updateTitle(run);
}

/* ---------- Backup ---------- */
function copyBackup() {
  const json = JSON.stringify(state, null, 2);
  const note = $('#copy-note');
  const fallback = () => {
    const ta = $('#backup-in'); ta.value = json; ta.focus(); ta.select();
    note.textContent = 'Clipboard is blocked here. The backup is selected in the box below; copy it with Ctrl+C or ⌘C.';
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(json).then(() => { note.textContent = `Copied ${plural(state.projects.length, 'project')}.`; }, fallback);
    } else fallback();
  } catch (e) { fallback(); }
}
function renderRestoreZone(confirming, msg) {
  const z = $('#restore-zone');
  z.innerHTML = confirming
    ? `<div class="confirm" role="alert"><span>Replace your ${plural(state.projects.length, 'project')} with the ${plural(pendingRestore.projects.length, 'project')} in this backup?</span><div class="row"><button class="btn btn-danger-solid" type="button" data-action="restore">Replace</button><button class="btn" type="button" data-action="cancel-restore">Keep current data</button></div></div>`
    : `<div class="row"><button class="btn" type="button" data-action="ask-restore">Restore</button>${msg ? `<span class="muted">${esc(msg)}</span>` : ''}</div>`;
}
function askRestore() {
  const raw = $('#backup-in').value.trim();
  if (!raw) { renderRestoreZone(false, 'Paste the text from Copy backup first.'); return; }
  try {
    const d = JSON.parse(raw);
    if (!valid(d)) throw new Error('shape');
    pendingRestore = d; renderRestoreZone(true);
  } catch (e) {
    renderRestoreZone(false, "That text isn't a Turn Meter backup. Paste the full text from Copy backup.");
  }
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]'); if (!b) return;
  ensureAudio();
  const a = b.dataset.action;
  const p = b.dataset.pid ? getP(b.dataset.pid) : null;
  const t = p && b.dataset.tid ? p.turns.find(x => x.id === b.dataset.tid) : null;
  switch (a) {
    case 'new-open': ui.newOpen = true; render(); $('#np-name')?.focus(); break;
    case 'new-close': ui.newOpen = false; render(); break;
    case 'clear-samples':
      state.projects = state.projects.filter(x => !x.sample);
      save(); render(); toast('Sample projects cleared.'); break;
    case 'pause': if (p && t) pause(p, t); break;
    case 'resume': if (p && t) resume(p, t); break;
    case 'finish': if (p && t) finish(p, t); break;
    case 'reopen': if (p && t) reopen(p, t); break;
    case 'edit-project': ui.editProject = true; render(); $('#ep-name')?.focus(); break;
    case 'cancel-edit-project': ui.editProject = false; render(); break;
    case 'edit-turn': if (t) { ui.editTurn = t.id; render(); $('#et-' + t.id)?.focus(); } break;
    case 'cancel-edit-turn': ui.editTurn = null; render(); break;
    case 'ask-delete-turn': if (t) { ui.confirm = 'turn:' + t.id; render(); } break;
    case 'delete-turn':
      if (p && t) { p.turns.splice(p.turns.indexOf(t), 1); ui.confirm = null; save(); render(); toast('Turn deleted.'); }
      break;
    case 'ask-delete-project': if (p) { ui.confirm = 'project:' + p.id; render(); } break;
    case 'delete-project':
      if (p) {
        state.projects = state.projects.filter(x => x !== p); ui.confirm = null; save();
        location.hash = ''; render(); toast(`Deleted ${p.name}.`);
      }
      break;
    case 'cancel-confirm': ui.confirm = null; render(); break;
    case 'copy-backup': copyBackup(); break;
    case 'ask-restore': askRestore(); break;
    case 'cancel-restore': pendingRestore = null; renderRestoreZone(false); break;
    case 'restore':
      if (pendingRestore) {
        state = normalize(pendingRestore); pendingRestore = null; save(); primeAlerts();
        $('#backup-in').value = ''; renderRestoreZone(false, 'Restored.');
        $('#chime').checked = !!state.settings.chime;
        location.hash = ''; render();
      }
      break;
  }
});

document.addEventListener('submit', e => {
  e.preventDefault(); ensureAudio();
  const f = e.target;
  if (f.id === 'np-form') {
    const name = $('#np-name').value.trim();
    if (!name) { $('#np-name').focus(); return; }
    const p = { id: uid(), name, desc: $('#np-desc').value.trim(), createdAt: now(), turns: [] };
    state.projects.push(p);
    ui.newOpen = false; ui.draftName = ''; ui.draftDesc = '';
    save(); location.hash = 'p-' + p.id;
  } else if (f.id === 'nt-form') {
    const p = getP(f.dataset.pid); if (p) startTurn(p, $('#nt-desc').value);
  } else if (f.classList.contains('edit-project')) {
    const p = getP(f.dataset.pid); const name = $('#ep-name').value.trim();
    if (p && name) { p.name = name; p.desc = $('#ep-desc').value.trim(); ui.editProject = false; save(); render(); }
  } else if (f.classList.contains('edit-turn')) {
    const p = getP(f.dataset.pid), t = p && p.turns.find(x => x.id === f.dataset.tid);
    if (t) { t.desc = $('#et-' + t.id).value.trim(); ui.editTurn = null; save(); render(); }
  }
});

let saveTimer;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'np-name') ui.draftName = el.value;
  else if (el.id === 'np-desc') ui.draftDesc = el.value;
  else if (el.id === 'nt-desc') ui.draftTurn = el.value;
  else if (el.id === 'turn-desc') {
    const p = getP(el.dataset.pid), t = p && p.turns.find(x => x.id === el.dataset.tid);
    if (!t) return;
    t.desc = el.value;
    const d = document.querySelector(`[data-desc-for="${t.id}"]`);
    if (d) { d.textContent = t.desc || 'No description'; d.classList.toggle('empty', !t.desc); }
    const s = $('#saved-note'); if (s) s.textContent = '';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { save(); const s2 = $('#saved-note'); if (s2) s2.textContent = 'Saved'; }, 400);
  }
});

document.addEventListener('toggle', e => {
  const d = e.target;
  if (d.matches && d.matches('details.segs')) d.open ? ui.openSegs.add(d.dataset.seg) : ui.openSegs.delete(d.dataset.seg);
}, true);

document.addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input', 'textarea', 'select', 'button', 'summary', 'a'].includes(tag) || e.target.isContentEditable) return;
  const r = route(); if (r.view !== 'project') return;
  const o = openTurn(r.p); if (!o) return;
  e.preventDefault(); ensureAudio();
  isRunning(o) ? pause(r.p, o) : resume(r.p, o);
});

window.addEventListener('hashchange', () => {
  ui.confirm = null; ui.editProject = false; ui.editTurn = null;
  render(); window.scrollTo(0, 0);
});

window.addEventListener('storage', e => {
  if (e.key !== KEY || !e.newValue) return;
  try { const d = JSON.parse(e.newValue); if (valid(d)) { state = normalize(d); render(); } } catch (err) {}
});

/* ---------- Boot ---------- */
const chimeBox = $('#chime');
chimeBox.checked = !!state.settings.chime;
chimeBox.addEventListener('change', () => { ensureAudio(); state.settings.chime = chimeBox.checked; save(); });
if (!storageOK) $('#storage-warn').hidden = false;
primeAlerts();
save();
render();
setInterval(tick, 500);
})();
</script>
</body>
</html>
